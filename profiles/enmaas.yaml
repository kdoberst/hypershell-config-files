id: enmaas-claude
display_name: EnMaaS for Claude
description: EnMaaS inference API
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: EnMaaS API key used by Claude Code
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.enmaas.devshift.net
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/lib/node_modules/@openai/**
  - /usr/local/bin/claude
  - /usr/bin/curl
  - /usr/local/bin/curl
