id: enmaas
display_name: EnMaaS
description: EnMaaS inference API
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: EnMaaS API key
    env_vars: [ENMAAS_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.enmaas.devshift.net
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/lib/node_modules/@openai/**
  - /usr/local/bin/claude
  - /usr/bin/curl
  - /usr/local/bin/curl
