version: 1

network_policies:
  enmaas_claude:
    endpoints:
      - host: api.enmaas.devshift.net
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude

  github_readonly:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/local/bin/gh

  jira_rest:
    endpoints:
      - host: redhat.atlassian.net
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /rest/api/3/**
          - allow:
              method: POST
              path: /rest/api/3/search
          - allow:
              method: POST
              path: /rest/api/3/issue
          - allow:
              method: PUT
              path: /rest/api/3/issue/**
          - allow:
              method: POST
              path: /rest/api/3/issue/**/comment
          - allow:
              method: POST
              path: /rest/api/3/issue/**/transitions
    binaries:
      - path: /usr/bin/python3.14

